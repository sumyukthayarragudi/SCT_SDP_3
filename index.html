<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sudoku Solver</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="solver-card">

        <!-- Header -->
        <h1 class="logo">🧩 Sudoku Solver</h1>

        <p class="hero-text">
            Solve Sudoku puzzles using the Backtracking Algorithm
        </p>


        <!-- Sudoku Grid -->
        <div class="sudoku-container">
            <div id="sudoku-grid" class="sudoku-grid"></div>
        </div>


        <!-- Message -->
        <div id="message" class="message"></div>


        <!-- Buttons -->
        <div class="buttons">

            <button id="example-btn" class="secondary-btn">
                Load Example
            </button>

            <button id="clear-btn" class="secondary-btn">
                Clear
            </button>

            <button id="solve-btn" class="primary-btn">
                 Solve Sudoku
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
